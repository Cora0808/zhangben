<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="账本">
<title>打工人小账本</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192-v2.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512-v2.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
/* ============ 设计令牌 ============ */
:root{
  --bg:#05070c; --bg2:#080c14; --panel:#0c1220; --panel2:#111a2b;
  --line:#1a2739; --line2:#26374f;
  --txt:#E8F2FF; --txt2:#8CA3C0; --txt3:#55698A;
  --cy:#00E5FF; --mg:#FF2E88; --gr:#00FFA3; --ye:#FFD60A;
  --pu:#B06BFF; --or:#FF8A3D; --rd:#FF4D4D;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--txt);font-family:var(--sans);
  font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
/* 全局网格纹理 + 扫描线 */
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    linear-gradient(rgba(0,229,255,.028) 1px,transparent 1px) 0 0/100% 42px,
    linear-gradient(90deg,rgba(0,229,255,.028) 1px,transparent 1px) 0 0/42px 100%,
    radial-gradient(1100px 620px at 78% -12%,rgba(176,107,255,.13),transparent 62%),
    radial-gradient(900px 520px at 8% 4%,rgba(0,229,255,.09),transparent 60%);
}
body::after{
  content:'';position:fixed;left:0;right:0;height:180px;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(0,229,255,.045),transparent);
  animation:scan 9s linear infinite;
}
@keyframes scan{0%{transform:translateY(-200px)}100%{transform:translateY(100vh)}}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.up{text-transform:uppercase;letter-spacing:.14em}

/* ============ 布局骨架 ============ */
.app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 14px 24px}
.scroll::-webkit-scrollbar{width:0}

/* ============ HUD 常驻状态条 ============ */
.hud{
  flex:none;padding:calc(var(--safe-t) + 12px) 14px 13px;
  background:linear-gradient(180deg,rgba(12,18,32,.96),rgba(8,12,20,.86));
  border-bottom:1px solid var(--line);position:relative;
}
.hud::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,var(--cy),transparent);opacity:.5}
.hud-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.hud-title{font-family:var(--mono);font-size:11px;color:var(--cy);letter-spacing:.22em;
  text-shadow:0 0 10px rgba(0,229,255,.5)}
.hud-title b{color:var(--txt);font-weight:600}
.mnav{display:flex;align-items:center;gap:2px}
.mnav button{background:none;border:1px solid var(--line);color:var(--txt2);width:26px;height:26px;
  border-radius:5px;font-size:13px;line-height:1;cursor:pointer;font-family:var(--mono)}
.mnav button:active{background:rgba(0,229,255,.14);color:var(--cy)}
.mnav .mcur{font-family:var(--mono);font-size:12px;color:var(--txt);min-width:62px;text-align:center;border:0}

.hud-body{display:flex;align-items:center;gap:14px}
.ring{position:relative;width:82px;height:82px;flex:none;cursor:pointer}
.ring svg{transform:rotate(-90deg);display:block}
.ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-in .p{font-family:var(--mono);font-size:19px;font-weight:600;line-height:1;
  color:var(--cy);text-shadow:0 0 12px rgba(0,229,255,.55)}
.ring-in .l{font-size:9px;color:var(--txt3);margin-top:3px;letter-spacing:.1em}
.hud-nums{flex:1;min-width:0;display:grid;grid-template-columns:1fr 1fr;gap:7px 10px}
.hud-cell .k{font-size:10px;color:var(--txt3);letter-spacing:.05em;display:flex;align-items:center;gap:4px}
.hud-cell .v{font-family:var(--mono);font-size:15px;font-weight:600;line-height:1.25;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-cell.wide{grid-column:span 2}
.hud-cell .v.big{font-size:23px;color:var(--cy);text-shadow:0 0 14px rgba(0,229,255,.4)}
.hud-cell .v.big.over{color:var(--mg);text-shadow:0 0 14px rgba(255,46,136,.45)}
.hud-cell .v.grn{color:var(--gr)}.hud-cell .v.ylw{color:var(--ye)}.hud-cell .v.mgn{color:var(--mg)}

.hud-bars{display:flex;gap:5px;margin-top:11px}
.hb{flex:1;cursor:pointer}
.hb .hb-t{display:flex;justify-content:space-between;font-size:10px;color:var(--txt3);margin-bottom:3px}
.hb .hb-t b{font-family:var(--mono);font-weight:500;color:var(--txt2)}
.hb .hb-b{height:4px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden;position:relative}
.hb .hb-f{height:100%;border-radius:2px;transition:width .5s cubic-bezier(.22,1,.36,1)}

/* ============ 应用内提醒条 ============ */
.remind-bar{
  flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 14px;background:rgba(0,229,255,.08);border:1px solid rgba(0,229,255,.35);
  border-left:0;border-right:0;position:relative;z-index:25;
  backdrop-filter:blur(8px);cursor:pointer;transition:background .15s
}
.remind-bar:active{background:rgba(0,229,255,.15)}
.remind-bar .r-msg{font-size:13px;color:var(--cy);text-shadow:0 0 10px rgba(0,229,255,.35);
  display:flex;align-items:center;gap:7px}
.remind-bar .r-actions{display:flex;gap:7px}
.remind-bar button{background:var(--bg);border:1px solid var(--cy);color:var(--cy);
  border-radius:7px;padding:5px 10px;font-size:12px;cursor:pointer;font-family:var(--sans)}
.remind-bar button.close{padding:5px 8px;background:transparent;border-color:transparent;color:var(--txt2)}
.remind-bar button.close:active{color:var(--txt)}

/* ============ 底部 Tab ============ */
.tabbar{
  flex:none;display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(8,12,20,.97);border-top:1px solid var(--line);
  padding-bottom:var(--safe-b);backdrop-filter:blur(14px);position:relative;z-index:30
}
.tabbar button{
  background:none;border:0;padding:8px 0 7px;color:var(--txt3);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;font-family:var(--sans)
}
.tabbar button .ti{width:21px;height:21px;opacity:.75}
.tabbar button span{font-size:10.5px;letter-spacing:.04em}
.tabbar button.on{color:var(--cy)}
.tabbar button.on .ti{opacity:1;filter:drop-shadow(0 0 6px rgba(0,229,255,.75))}
.tabbar button.on::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:26px;height:2px;background:var(--cy);box-shadow:0 0 10px var(--cy)}

/* ============ FAB ============ */
.fab{
  position:fixed;right:16px;bottom:calc(var(--safe-b) + 68px);z-index:35;
  width:54px;height:54px;border-radius:16px;border:0;cursor:pointer;
  background:linear-gradient(145deg,var(--cy),#0090B8);
  color:#02141A;font-size:27px;font-weight:300;line-height:1;
  box-shadow:0 0 22px rgba(0,229,255,.45),0 6px 18px rgba(0,0,0,.55);
  display:flex;align-items:center;justify-content:center;
  transition:transform .16s cubic-bezier(.34,1.56,.64,1)
}
.fab:active{transform:scale(.9)}

/* ============ 卡片 ============ */
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px;margin-top:11px;position:relative}
.card::before,.card::after{content:'';position:absolute;width:9px;height:9px;pointer-events:none}
.card::before{top:-1px;left:-1px;border-top:1px solid var(--cy);border-left:1px solid var(--cy);
  border-top-left-radius:11px;opacity:.55}
.card::after{bottom:-1px;right:-1px;border-bottom:1px solid var(--cy);border-right:1px solid var(--cy);
  border-bottom-right-radius:11px;opacity:.55}
.c-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.c-title{font-family:var(--mono);font-size:11px;color:var(--cy);letter-spacing:.16em;
  text-shadow:0 0 9px rgba(0,229,255,.4)}
.c-sub{font-size:10.5px;color:var(--txt3)}

/* ============ 通用元件 ============ */
.btn{background:rgba(0,229,255,.09);border:1px solid rgba(0,229,255,.4);color:var(--cy);
  border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;font-family:var(--sans);
  transition:all .15s}
.btn:active{background:rgba(0,229,255,.24);box-shadow:0 0 14px rgba(0,229,255,.35)}
.btn.ghost{background:transparent;border-color:var(--line2);color:var(--txt2)}
.btn.ghost:active{background:rgba(255,255,255,.06)}
.btn.mg{background:rgba(255,46,136,.1);border-color:rgba(255,46,136,.42);color:var(--mg)}
.btn.mg:active{background:rgba(255,46,136,.24);box-shadow:0 0 14px rgba(255,46,136,.3)}
.btn.full{width:100%}
.btn.sm{padding:5px 11px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.35}

.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:20px;
  border:1px solid var(--line2);background:var(--panel2);color:var(--txt2);
  font-size:12.5px;cursor:pointer;white-space:nowrap;transition:all .15s}
.chip.on{border-color:var(--cy);color:var(--cy);background:rgba(0,229,255,.13);
  box-shadow:0 0 11px rgba(0,229,255,.22)}
.chip .dot{width:7px;height:7px;border-radius:50%;flex:none}
.hscroll{display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;-webkit-overflow-scrolling:touch}
.hscroll::-webkit-scrollbar{height:0}

.field{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 0;border-bottom:1px solid rgba(255,255,255,.045)}
.field:last-child{border-bottom:0}
.field .fl{font-size:13.5px;color:var(--txt)}
.field .fh{font-size:10.5px;color:var(--txt3);margin-top:1px}
.inp{background:var(--bg2);border:1px solid var(--line2);color:var(--txt);border-radius:7px;
  padding:7px 10px;font-size:14px;font-family:var(--mono);width:104px;text-align:right;outline:0}
.inp:focus{border-color:var(--cy);box-shadow:0 0 0 2px rgba(0,229,255,.14)}
.inp.wide{width:150px}
.sw{width:42px;height:23px;border-radius:12px;background:var(--line2);position:relative;
  cursor:pointer;transition:background .2s;flex:none;border:0}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;
  background:var(--txt2);transition:all .2s}
.sw.on{background:rgba(0,229,255,.32)}
.sw.on::after{left:21px;background:var(--cy);box-shadow:0 0 9px var(--cy)}

.bar{height:5px;background:rgba(255,255,255,.055);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;transition:width .5s cubic-bezier(.22,1,.36,1)}

.tag{font-family:var(--mono);font-size:9.5px;padding:2px 6px;border-radius:4px;letter-spacing:.06em;
  border:1px solid currentColor;opacity:.9}
.empty{text-align:center;padding:34px 16px;color:var(--txt3);font-size:13px}
.empty .e-ic{font-size:30px;opacity:.3;margin-bottom:9px}

/* ============ 流水列表 ============ */
.daygrp{margin-top:13px}
.daygrp .dh{display:flex;align-items:baseline;justify-content:space-between;
  padding:0 3px 6px;font-size:11px;color:var(--txt3);font-family:var(--mono);letter-spacing:.08em}
.daygrp .dh em{font-style:normal;color:var(--txt3);font-size:10.5px}
.rec-row{position:relative;overflow:hidden;border-radius:10px;margin-bottom:5px}
.rec-in{display:flex;align-items:center;gap:11px;padding:10px 12px;background:var(--panel);
  border:1px solid var(--line);position:relative;z-index:1;transform:translateX(0);transition:transform .22s cubic-bezier(.22,1,.36,1)}
.rec-row.sliding .rec-in{transform:translateX(-64px)}
.rec-ic{width:33px;height:33px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.rec-ic svg{width:17px;height:17px}
.rec-mid{flex:1;min-width:0}
.rec-mid .t1{font-size:14px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-mid .t2{font-size:11px;color:var(--txt3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-amt{font-family:var(--mono);font-size:15px;font-weight:600;flex:none}
.rec-del{position:absolute;right:0;top:0;bottom:0;width:64px;background:rgba(255,77,77,.2);
  border:1px solid rgba(255,77,77,.4);color:var(--rd);display:flex;align-items:center;justify-content:center;
  font-size:12px;border-radius:0 10px 10px 0}

/* ============ 记账 Sheet ============ */
.mask{position:fixed;inset:0;background:rgba(2,4,8,.8);z-index:60;opacity:0;pointer-events:none;
  transition:opacity .22s;backdrop-filter:blur(3px)}
.mask.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:560px;margin:0 auto;
  background:linear-gradient(180deg,#0e1524,#0a0e18);
  border-top:1px solid var(--cy);border-radius:18px 18px 0 0;
  box-shadow:0 -8px 42px rgba(0,229,255,.15);
  transform:translateY(102%);transition:transform .3s cubic-bezier(.22,1,.36,1);
  padding:8px 16px calc(var(--safe-b) + 14px);
  max-height:92vh;overflow-y:auto
}
.sheet.on{transform:translateY(0)}
.sheet-grip{width:38px;height:4px;background:var(--line2);border-radius:2px;margin:0 auto 12px}
.sheet-tabs{display:flex;gap:8px;margin-bottom:12px}
.sheet-tabs button{flex:1;padding:8px 0;border-radius:9px;border:1px solid var(--line2);
  background:var(--panel);color:var(--txt2);font-size:13.5px;cursor:pointer;font-family:var(--sans)}
.sheet-tabs button.on{background:rgba(0,229,255,.13);border-color:var(--cy);color:var(--cy);
  box-shadow:0 0 12px rgba(0,229,255,.2)}
.amt-disp{display:flex;align-items:center;justify-content:center;gap:4px;padding:14px 0 16px;
  border-bottom:1px solid var(--line);margin-bottom:13px}
.amt-disp .cur{font-family:var(--mono);font-size:22px;color:var(--txt3)}
.amt-disp .val{font-family:var(--mono);font-size:38px;font-weight:600;line-height:1;
  color:var(--cy);text-shadow:0 0 20px rgba(0,229,255,.42);min-width:30px}
.amt-disp.neg .val{color:var(--mg);text-shadow:0 0 20px rgba(255,46,136,.42)}
.amt-disp .val.ph{color:var(--txt3);text-shadow:none;font-size:30px}

.lbl{font-family:var(--mono);font-size:10px;color:var(--txt3);letter-spacing:.14em;margin:0 0 7px}
.note-in{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:9px;
  padding:10px 12px;color:var(--txt);font-size:14px;outline:0;font-family:var(--sans)}
.note-in:focus{border-color:var(--cy);box-shadow:0 0 0 2px rgba(0,229,255,.13)}
#dateIn{background:var(--bg2);border:1px solid var(--line2);color:var(--txt);border-radius:8px;
  padding:7px 10px;font-family:var(--mono);font-size:13px;outline:0;flex:1;min-width:0;
  color-scheme:dark}
#dateIn:focus{border-color:var(--cy)}
.smart-hint{font-size:11px;color:var(--gr);margin-top:6px;display:flex;align-items:center;gap:5px;min-height:16px}
.smart-hint b{color:var(--cy);font-weight:500}

.kb{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:13px}
.kb button{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  border-radius:10px;padding:13px 0;font-family:var(--mono);font-size:20px;cursor:pointer;
  transition:all .1s}
.kb button:active{background:rgba(0,229,255,.2);border-color:var(--cy);color:var(--cy)}
.kb button.fn{font-size:14px;color:var(--txt2);background:var(--panel)}
.kb button.ok{background:rgba(0,229,255,.16);border-color:var(--cy);color:var(--cy);
  font-size:15px;font-family:var(--sans)}
.kb button.ok:active{background:rgba(0,229,255,.34)}
.kb button.del{color:var(--mg)}

/* ============ 弹窗（通用） ============ */
.modal{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:18px}
.modal.on{display:flex}
.modal-bd{background:var(--panel);border:1px solid var(--line2);border-radius:13px;padding:18px;
  width:100%;max-width:380px;max-height:86vh;overflow-y:auto;position:relative;
  box-shadow:0 20px 60px rgba(0,0,0,.7)}
.modal-bd h3{margin:0 0 13px;font-size:15px;color:var(--txt);font-family:var(--mono);letter-spacing:.06em}

/* ============ Toast ============ */
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);
  bottom:calc(var(--safe-b) + 88px);z-index:90;background:rgba(10,16,26,.97);
  border:1px solid var(--cy);color:var(--txt);padding:10px 17px;border-radius:10px;font-size:13px;
  box-shadow:0 0 26px rgba(0,229,255,.3);opacity:0;pointer-events:none;transition:all .26s;
  max-width:88vw;text-align:center;font-family:var(--mono)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.warn{border-color:var(--ye);box-shadow:0 0 26px rgba(255,214,10,.28)}
.toast.err{border-color:var(--rd);box-shadow:0 0 26px rgba(255,77,77,.28)}

/* ============ 预算页 ============ */
.bk-card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px;margin-top:10px}
.bk-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bk-ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.bk-ic svg{width:18px;height:18px}
.bk-nm{font-size:14.5px;font-weight:500}
.bk-pct{margin-left:auto;font-family:var(--mono);font-size:17px;font-weight:600}
.bk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:10px}
.bk-grid div span{display:block;font-size:10px;color:var(--txt3)}
.bk-grid div b{font-family:var(--mono);font-size:14px;font-weight:600;margin-top:1px;display:block}
.pct-row{display:flex;align-items:center;gap:10px;padding:8px 0}
.pct-row .pn{font-size:13.5px;width:74px;flex:none}
.pct-row input[type=range]{flex:1;height:4px;-webkit-appearance:none;appearance:none;
  background:var(--line2);border-radius:2px;outline:0}
.pct-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:19px;height:19px;
  border-radius:50%;background:var(--cy);box-shadow:0 0 10px rgba(0,229,255,.6);cursor:pointer}
.pct-row .pv{font-family:var(--mono);font-size:14px;width:52px;text-align:right;flex:none}

/* ============ 理财页 ============ */
.inv-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;text-align:center}
.inv-sum div span{display:block;font-size:10px;color:var(--txt3);letter-spacing:.04em}
.inv-sum div b{font-family:var(--mono);font-size:17px;font-weight:600;display:block;margin-top:3px}
.inv-row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.045)}
.inv-row:last-child{border-bottom:0}
.inv-nm{flex:1;min-width:0}
.inv-nm .n{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv-nm .s{font-size:10.5px;color:var(--txt3);font-family:var(--mono);margin-top:2px}
.inv-rt{text-align:right;flex:none}
.inv-rt .v{font-family:var(--mono);font-size:15px;font-weight:600}
.inv-rt .p{font-family:var(--mono);font-size:11px;margin-top:2px}
.pos{color:var(--gr)}.neg{color:var(--rd)}.zer{color:var(--txt3)}

/* ============ 分析页 ============ */

/* ============ 分类管理 ============ */

  padding:5px 8px;font-size:13px;width:100px;outline:0;font-family:var(--sans)}
.cat-nm input:focus{border-color:var(--cy)}

<script>
/* =========================================================
   打工人小账本 — 赛博版
   存储：wb_cyber_v1（全新结构，与旧版不兼容，旧数据自动归档不读）
   ========================================================= */

/* ---------- 图标 ---------- */
const ICONS={
 home:'M3 10.5 12 3l9 7.5M5 9.5V21h14V9.5',
 bowl:'M4 11h16a8 8 0 0 1-16 0zM2 21h20M9 7c0-1.5 1-2 1-3M14 7c0-1.5 1-2 1-3',
 car:'M5 16V9.5L7 5h10l2 4.5V16M3 16h18M7 19a1.5 1.5 0 1 0 0-3M17 19a1.5 1.5 0 1 0 0-3',
 bag:'M6 8h12l1 12H5zM9 8V6a3 3 0 0 1 6 0v2',
 game:'M7 8h10a4 4 0 0 1 4 4v3a3 3 0 0 1-5 1.5L14 15h-4l-2 1.5A3 3 0 0 1 3 15v-3a4 4 0 0 1 4-4zM7 11v2M6 12h2M16 11.5h.01M18 13.5h.01',
 heart:'M12 20s-7-4.4-7-9.4A3.6 3.6 0 0 1 12 8a3.6 3.6 0 0 1 7 2.6c0 5-7 9.4-7 9.4z',
 wallet:'M3 7h15a3 3 0 0 1 3 3v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 7V6a2 2 0 0 1 2-2h10M17 13h.01',
 pig:'M4 12a6 6 0 0 1 6-6h3a5 5 0 0 1 5 5v2h-2l-1 3h-3l-1-2H9l-1 2H5zM9 11h.01M16 6l2-2',
 up:'M12 19V5M6 11l6-6 6 6',
 chart:'M4 20V11M10 20V4M16 20v-6M22 20H2',
 spark:'M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z',
 book:'M4 5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2zM8 7h8M8 11h8',
 gift:'M3 11h18v9H3zM3 8h18v3H3zM12 8v12M12 8C10 8 8 7 8 5.5S9.5 4 10 5s2 3 2 3zM12 8c2 0 4-1 4-2.5S14.5 4 14 5s-2 3-2 3z',
 phone:'M7 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM10 18h4',
 plane:'M12 2l2.5 8.5L22 13l-7.5 2.5L12 22l-2.5-6.5L2 13l7.5-2.5z',
 coffee:'M4 8h13v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM17 9h2a3 3 0 0 1 0 6h-2M6 2v3M10 2v3M14 2v3',
 layers:'M12 3l9 5-9 5-9-5zM3 13l9 5 9-5',
 goal:'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM12 12h.01',
 warn:'M12 3l9 16H3zM12 9v5M12 17h.01',
 pencil:'M4 20h4L20 8l-4-4L4 16z',
};
function svg(ic,size,color,sw){
  size=size||18;color=color||'currentColor';sw=sw||1.8;
  return '<svg viewBox="0 0 24 24" width="'+size+'" height="'+size+'" fill="none" stroke="'+color+
    '" stroke-width="'+sw+'" stroke-linecap="round" stroke-linejoin="round"><path d="'+(ICONS[ic]||ICONS.spark)+'"/></svg>';
}

/* ---------- 常量 ---------- */
const KEY='wb_cyber_v1';
/* 版本号：改一次功能就 +1。用户能在设置页看到，报问题时先报这个，
   否则根本分不清"没修好"还是"没刷到新版"。 */
const APP_VER='v2.9';
const BUCKETS=[
  {k:'necessity', n:'衣食住行', c:'#00E5FF'},
  {k:'freedom',   n:'休闲娱乐', c:'#FF2E88'},
  {k:'shortsave', n:'短期储蓄', c:'#B06BFF'}
];
const BKC={necessity:'#00E5FF',freedom:'#FF2E88',shortsave:'#B06BFF',fixednc:'#FF8A3D',income:'#00FFA3',other:'#55698A'};
const SYS_CATS={
  income:    {n:'收入',       c:'#00FFA3', i:'wallet', sign:1,  bk:'',          sys:1},
  necessity: {n:'衣食住行',   c:'#00E5FF', i:'home',   sign:-1, bk:'necessity', sys:1},
  freedom:   {n:'休闲娱乐',   c:'#FF2E88', i:'balloon',sign:-1, bk:'freedom',   sys:1},
  fixednc:   {n:'固定/投资',  c:'#FF8A3D', i:'up',     sign:-1, bk:'fixednc',   sys:1},
  shortsave: {n:'短期储蓄',   c:'#B06BFF', i:'pig',    sign:-1, bk:'shortsave', sys:1},
  other:     {n:'其他',       c:'#55698A', i:'spark',  sign:-1, bk:'',          sys:1}
};
SYS_CATS.freedom.i='game';
const PRESET={
  c_food:   {n:'餐饮',   c:'#00E5FF', i:'bowl',   sign:-1, bk:'necessity'},
  c_traffic:{n:'交通',   c:'#FFD60A', i:'car',    sign:-1, bk:'necessity'},
  c_shop:   {n:'购物',   c:'#FF2E88', i:'bag',    sign:-1, bk:'necessity'},
  c_live:   {n:'居住',   c:'#00FFA3', i:'home',   sign:-1, bk:'necessity'},
  c_fun:    {n:'娱乐',   c:'#B06BFF', i:'game',   sign:-1, bk:'freedom'},
  c_health: {n:'医疗健康',c:'#FF8A3D',i:'heart',  sign:-1, bk:'necessity'}
};
const INC_TYPES=[
  {k:'salary',  n:'工资'},
  {k:'bonus',   n:'奖金'},
  {k:'other',   n:'其他收入'},
  {k:'external',n:'家里补贴'},
  {k:'invest',  n:'理财回流'}
];
const COLOR_SETS=['#00E5FF','#FF2E88','#00FFA3','#FFD60A','#B06BFF','#FF8A3D','#FF4D4D','#55698A'];

/* ---------- 2026 年法定节假日 & 调休上班日（来源：新华社/国务院通知） ---------- */
const HOL_RANGES_2026=[
  ['2026-01-01','2026-01-03'],  // 元旦
  ['2026-02-15','2026-02-23'],  // 春节
  ['2026-04-04','2026-04-06'],  // 清明
  ['2026-05-01','2026-05-05'],  // 劳动节
  ['2026-06-19','2026-06-21'],  // 端午
  ['2026-09-25','2026-09-27'],  // 中秋
  ['2026-10-01','2026-10-07']   // 国庆
];
const WORK_EXTRA_2026=['2026-01-04','2026-02-14','2026-02-28','2026-05-09','2026-09-20','2026-10-10'];

/* ---------- 状态 ---------- */
function defaults(){
  const cats={};
  Object.keys(SYS_CATS).forEach(k=>cats[k]=Object.assign({},SYS_CATS[k]));
  Object.keys(PRESET).forEach(k=>cats[k]=Object.assign({},PRESET[k]));
  return {
    v:3,
    profile:{payday:10, payRule:{mode:'fixed',day:10,n:7}, remindOn:false, remindH:21},
    recs:[],
    pcts:{necessity:65, freedom:10, shortsave:25},
    fixednc:0,
    openBal:{},
    cats:cats,
    invVal:{},
    invCost:{},
    recur:[],
    smart:{},
    tplPin:[],
    holExtra:[],
    workExtra:[],
    lastRemind:'',
    lastExport:'',
    inited:false,
    tab:'record'
  };
}
let S=defaults();
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){ toast('存储失败','err'); } }
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw) return null;
    const d=JSON.parse(raw);
    if(!d||typeof d!=='object') return null;
    return d;
  }catch(e){ return null; }
}

/* ---------- 工具 ---------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmt(n){
  n=Math.round((Number(n)||0)*100)/100;
  const neg=n<0; n=Math.abs(n);
  let s=(Math.round(n*100)/100).toFixed(Math.abs(n%1)>0.004?2:0);
  s=s.replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return (neg?'-':'')+s;
}
function money(n){ return '¥'+fmt(n); }
function pad(n){ return n<10?'0'+n:''+n; }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function mkey(dstr){ return String(dstr||'').slice(0,7); }
function curM(){ return todayStr().slice(0,7); }
function mLabel(m){ return m? (m.slice(0,4)+'年'+(+m.slice(5,7))+'月') : '—'; }
function addMonth(m,d){
  let y=+m.slice(0,4), mm=+m.slice(5,7)-1+d;
  y+=Math.floor(mm/12); mm=((mm%12)+12)%12;
  return y+'-'+pad(mm+1);
}
function daysIn(m){ return new Date(+m.slice(0,4), +m.slice(5,7), 0).getDate(); }
function addDateStr(dstr, days){
  const d=new Date(dstr); d.setDate(d.getDate()+days);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function weekdayN(dstr){ return new Date(dstr).getDay(); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function clampPct(v){ v=Math.round(Number(v)||0); return Math.max(0,Math.min(100,v)); }

let viewM=curM();
let curTab='record';

/* ---------- 分类 ---------- */
function cat(k){ return S.cats[k]||SYS_CATS[k]||{n:'未分类',c:'#55698A',i:'spark',sign:-1,bk:''}; }
function bkOf(k){ return cat(k).bk||''; }
function catColor(k){ return cat(k).c; }
function spendCats(){
  const out=[];
  ['necessity','freedom','shortsave','fixednc','other'].forEach(k=>{ if(S.cats[k]) out.push(k); });
  Object.keys(S.cats).forEach(k=>{ if(!out.includes(k) && S.cats[k].sign===-1) out.push(k); });
  return out;
}
function incomeCats(){ return ['income']; }

/* ---------- 计算引擎 ---------- */
function recsOf(m){ return S.recs.filter(r=>mkey(r.d)===m); }

/* ---------- 工作日 / 发薪日 / 期初余额 ---------- */
function isWorkday(dstr){
  if(S.workExtra && S.workExtra.indexOf(dstr)>=0) return true;
  if(WORK_EXTRA_2026.indexOf(dstr)>=0) return true;
  if(S.holExtra && S.holExtra.indexOf(dstr)>=0) return false;
  for(let i=0;i<HOL_RANGES_2026.length;i++){
    const r=HOL_RANGES_2026[i];
    if(dstr>=r[0] && dstr<=r[1]) return false;
  }
  const w=weekdayN(dstr);
  return w!==0 && w!==6;
}
function workdayN(m, n){
  let d=m+'-01', c=0;
  while(c<n){
    if(isWorkday(d)){ c++; if(c===n) return d; }
    d=addDateStr(d,1);
    if(!d.startsWith(m)) break;
  }
  return d;
}
function paydayFor(m){
  const r=S.profile.payRule||{mode:'fixed',day:10,n:7};
  const mode=r.mode||'fixed';
  if(mode==='nth') return workdayN(m, Math.max(1,Math.min(25,+r.n||7)));
  const day=Math.max(1,Math.min(28,+r.day||10));
  if(mode==='fixed') return m+'-'+pad(day);
  let d=m+'-'+pad(day);
  const dir = mode==='prev' ? -1 : 1;
  for(let i=0;i<62;i++){
    if(isWorkday(d)) return d;
    d=addDateStr(d,dir);
  }
  return d;
}
function daysToPayday(m){
  const p=paydayFor(m);
  const today=todayStr();
  if(today<=p){
    const n=Math.round((new Date(p)-new Date(today))/86400000);
    return n>=0?n:0;
  }
  return null;
}
function invBack(m){
  m=m||viewM;
  return recsOf(m).filter(r=>r.cat==='income' && r.it==='invest').reduce((s,r)=>s+(+r.amt||0),0);
}
/* ---------- 家里补贴（external）：不计入活钱，但接住超出的部分 ----------
 * 口径：预算分母始终是自己的工资（保住"钱不够用"的警报），
 *      补贴垫在下面吸收超支，吸收不完的部分才算真超支。 */
function monthSubsidy(m){
  m=m||viewM;
  return recsOf(m).filter(r=>r.cat==='income' && r.it==='external')
    .reduce((s,r)=>s+(+r.amt||0),0);
}
/** 超出工资预算的部分（还没扣补贴） */
function overBudget(m){
  m=m||viewM;
  const bs=bucketSpend(m);
  return Math.max(0, (bs.necessity+bs.freedom+bs.shortsave) - dispIncome(m));
}
/** 补贴已被动用多少 */
function subsidyUsed(m){ m=m||viewM; return Math.min(monthSubsidy(m), overBudget(m)); }
/** 真超支：连补贴都兜不住的部分 */
function realOver(m){ m=m||viewM; return Math.max(0, overBudget(m)-monthSubsidy(m)); }

function endBal(m){
  m=m||viewM;
  return openBal(m)+monthIncome(m)+monthSubsidy(m)+invBack(m)-monthOut(m);
}
function openBal(m){
  m=m||viewM;
  if(typeof (S.openBal||{})[m]==='number') return S.openBal[m];
  // 找最近一个手填的月份作为起点，计算其期末余额并逐月滚到 m 的前一个月
  let mm='', found=false;
  for(let i=1;i<=36;i++){
    mm=addMonth(m,-i);
    if(typeof S.openBal[mm]==='number'){ found=true; break; }
  }
  let bal=0, cur='';
  if(found){ bal=S.openBal[mm]; cur=mm; }
  else{
    // 没有手填起点时，从最早有记录月份的前一个月开始滚
    const months=[...new Set(S.recs.map(r=>mkey(r.d)))].sort();
    if(months.length && months[0]<=m){ cur=addMonth(months[0],-1); bal=0; }
    else return 0;
  }
  while(true){
    // 先算 cur 的期末余额，再决定 nxt 是否到达目标月
    // 注意必须带上 monthSubsidy：补贴不进活钱但会花掉，漏掉它期末会凭空少一截
    bal = bal + monthIncome(cur) + monthSubsidy(cur) + invBack(cur) - monthOut(cur);
    const nxt=addMonth(cur,1);
    if(nxt===m) break;
    if(typeof S.openBal[nxt]==='number') bal=S.openBal[nxt];
    cur=nxt;
    if(cur>m) break;
  }
  return bal;
}

/** 活钱：当月收入（不含外部进项、理财回流，那是本金搬运不是收入） */
function monthIncome(m){
  m=m||viewM;
  return recsOf(m).filter(r=>r.cat==='income' && r.it!=='external' && r.it!=='invest')
    .reduce((s,r)=>s+(+r.amt||0),0);
}
/** 固定/投资类实际支出（含投资买入） */
function monthFixed(m){
  m=m||viewM;
  return recsOf(m).filter(r=>bkOf(r.cat)==='fixednc').reduce((s,r)=>s+(+r.amt||0),0);
}
/** 消费类支出（三桶内） */
function bucketSpend(m){
  m=m||viewM;
  const o={necessity:0,freedom:0,shortsave:0};
  recsOf(m).forEach(r=>{
    const b=bkOf(r.cat);
    if(o.hasOwnProperty(b)) o[b]+=(+r.amt||0);
  });
  return o;
}
/** 当月总支出（消费 + 固定/投资） */
function monthOut(m){
  m=m||viewM;
  const bs=bucketSpend(m);
  return bs.necessity+bs.freedom+bs.shortsave+monthFixed(m);
}
/** 可支配收入 = 期初余粮 + 活钱 − 固定非消费计划 */
/** 固定/投资完全由实际记账驱动：付出去的时候记到固定桶，这里自动扣。
 *  不再有手填的"计划"字段 —— 金额日期都浮动的支出（宠物月卡、给家里的钱）
 *  预先填一个数只会记错，不如实报实销。
 *  注：S.fixednc 作为遗留字段保留（老数据不丢），但不再参与计算。 */
function fixedBase(m){
  m=m||viewM;
  return monthFixed(m);
}
function dispIncome(m){
  m=m||viewM;
  return Math.max(0, openBal(m) + monthIncome(m) - fixedBase(m));
}
/** 各桶预算 */
function budgets(m){
  m=m||viewM;
  const d=dispIncome(m), o={};
  BUCKETS.forEach(b=>{ o[b.k]=Math.round(d*((+S.pcts[b.k]||0)/100)); });
  return o;
}
/** 剩余可花 = 可支配 + 家里补贴 − 三桶已花
 *  （补贴是真实到手且不用还的钱，加进来才不会在"动用补贴"时误报超支） */
function leftOver(m){
  m=m||viewM;
  const bs=bucketSpend(m);
  return dispIncome(m) + monthSubsidy(m) - (bs.necessity+bs.freedom+bs.shortsave);
}
/** 储蓄率 = (活钱 − 消费支出) / 活钱 */
function saveRate(m){
  m=m||viewM;
  const inc=monthIncome(m);
  if(!inc) return 0;
  const bs=bucketSpend(m);
  const consume=bs.necessity+bs.freedom; // 短期储蓄与固定不算消费
  return (inc-consume)/inc;
}

/* ---------- 理财 ---------- */
/**
 * 持仓：优先用手动成本(S.invCost)，否则由买入/赎回记录累计。
 * 只填过市值、没有任何买入记录的产品（"本来就持有"）同样会列出来。
 */
function holdings(){
  const h={};
  S.recs.forEach(r=>{
    if(r.cat!=='fixednc'||!r.inv) return;
    const k=r.inv;
    if(!h[k]) h[k]={name:k, cost:0, in:0, out:0};
    if(r.op==='redeem'){ h[k].out+=(+r.amt||0); }
    else { h[k].cost+=(+r.amt||0); h[k].in+=(+r.amt||0); }
  });
  // 只有市值/只有手动成本、没有记录的产品也要出现
  [S.invVal, S.invCost].forEach(src=>{
    Object.keys(src||{}).forEach(k=>{ if(!h[k]) h[k]={name:k, cost:0, in:0, out:0}; });
  });
  Object.keys(h).forEach(k=>{
    h[k].cost=Math.max(0, h[k].cost - h[k].out);
    if(S.invCost && typeof S.invCost[k]==='number'){
      h[k].cost=S.invCost[k];
      h[k].costManual=true;
    }
    // 成本已知 = 有买入/赎回记录，或用户手动填过成本（哪怕填 0）
    const costKnown = h[k].in>0 || h[k].out>0 || h[k].costManual || false;
    const mv=(S.invVal&&typeof S.invVal[k]==='number')?S.invVal[k]:h[k].cost;
    h[k].mv=mv;
    h[k].costKnown=costKnown;
    // 成本未知时，收益和收益率都视为无法计算
    h[k].gain=costKnown? (mv-h[k].cost) : null;
    h[k].rate=(costKnown && h[k].cost)? (mv-h[k].cost)/h[k].cost : null;
  });
  return h;
}
function invNames(){
  const set={};
  S.recs.forEach(r=>{ if(r.inv) set[r.inv]=1; });
  Object.keys(S.invVal||{}).forEach(k=>set[k]=1);
  Object.keys(S.invCost||{}).forEach(k=>set[k]=1);
  return Object.keys(set);
}
function invTotal(){
  const h=holdings(); let cost=0,mv=0,gain=0,noCost=0;
  Object.keys(h).forEach(k=>{
    const x=h[k]; mv+=x.mv;
    if(x.costKnown){ cost+=x.cost; gain+=(x.gain||0); }
    else noCost++;
  });
  return {cost:cost, mv:mv, gain:gain,
          rate:cost?(mv-cost)/cost:null, noCost:noCost, n:Object.keys(h).length};
}

/* ---------- 智能分类 ---------- */
function smartGuess(note){
  note=String(note||'').trim();
  if(!note) return null;
  if(S.smart[note]) return {cat:S.smart[note], exact:true};
  let best=null, bl=0;
  Object.keys(S.smart).forEach(k=>{
    if(k.length>bl && note.indexOf(k)>=0){ bl=k.length; best=S.smart[k]; }
  });
  return best? {cat:best, exact:false} : null;
}
function smartLearn(note,c){
  note=String(note||'').trim();
  if(!note||!c) return;
  if(S.smart[note]===c) return;
  S.smart[note]=c;
  // 上限保护
  const ks=Object.keys(S.smart);
  if(ks.length>400) ks.slice(0,ks.length-400).forEach(k=>{ delete S.smart[k]; });
}
function delSmart(note){ if(S.smart.hasOwnProperty(note)){ delete S.smart[note]; save(); } }

/* ---------- 快捷模板 ---------- */
function topTpls(){
  const cut=addMonth(curM(),-2);
  const map={};
  S.recs.forEach(r=>{
    if(mkey(r.d)<cut) return;
    if(bkOf(r.cat)==='fixednc'||r.cat==='income') return;
    const note=String(r.note||'').trim()||cat(r.cat).n;
    const k=r.cat+'|'+note+'|'+Math.round((+r.amt||0));
    if(!map[k]) map[k]={cat:r.cat, note:note, amt:Math.round(+r.amt||0), hits:0, ts:r.ts||0};
    map[k].hits++; if((r.ts||0)>map[k].ts) map[k].ts=r.ts;
  });
  const arr=Object.keys(map).map(k=>map[k]).filter(x=>x.hits>=2).sort((a,b)=>b.hits-a.hits||b.ts-a.ts).slice(0,6);
  const pinned=(S.tplPin||[]).map(id=>{
    const r=S.recs.find(x=>x.id===id); if(!r) return null;
    return {cat:r.cat, note:String(r.note||'').trim()||cat(r.cat).n, amt:Math.round(+r.amt||0), pin:true, rid:r.id};
  }).filter(Boolean);
  return pinned.concat(arr.filter(a=>!pinned.some(p=>p.cat===a.cat&&p.note===a.note&&p.amt===a.amt))).slice(0,8);
}

/* ---------- 周期记账 ---------- */
function genRecur(silent){
  const m=curM();
  const today=+todayStr().slice(8,10);
  let made=0, names=[];
  (S.recur||[]).forEach(it=>{
    if(!it.on) return;
    if(it.last===m) return;
    if(today < (+it.day||1)) return;
    const d=m+'-'+pad(Math.min(+it.day||1, daysIn(m)));
    if(S.recs.some(r=>r.rid===it.id && mkey(r.d)===m)) { it.last=m; return; }
    S.recs.push({id:uid(), d:d, cat:it.cat, amt:+it.amt||0, note:it.note||'', ts:Date.now(), rid:it.id, auto:1});
    it.last=m; made++; names.push((it.note||cat(it.cat).n)+' '+money(it.amt));
  });
  if(made){ save(); if(!silent) toast('已自动记账 '+made+' 笔：'+names.slice(0,2).join('、')+(made>2?' 等':'')); }
  return made;
}
/** 本月周期项（含未到期） */
function recurStatus(){
  const m=viewM, today=m===curM()? +todayStr().slice(8,10) : 99;
  return (S.recur||[]).map(it=>{
    const done=S.recs.some(r=>r.rid===it.id && mkey(r.d)===m);
    const due=(+it.day||1)<=today;
    return {it:it, done:done, pending:due&&!done, future:!due&&!done};
  }).sort((a,b)=>(+a.it.day||1)-(+b.it.day||1));
}

/* ---------- 提醒 ---------- */
let remindTimer=null;
function setupRemind(){
  if(remindTimer){ clearTimeout(remindTimer); remindTimer=null; }
  // 无论系统通知是否支持，都启用应用内提醒
  checkInAppRemind();
  // 系统通知定时器（若已授权）
  if(!S.profile.remindOn) return;
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  const h=+S.profile.remindH||21;
  const now=new Date();
  const target=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,0,0,0);
  let ms=target-now; if(ms<0) ms+=86400000;
  remindTimer=setTimeout(()=>{
    const unt=todayUnrecorded();
    try{
      new Notification('记账提醒',{body: unt>0? ('今天还有 '+unt+' 天没记账，补一笔？') : '今天的账记完了，看下预算余量。', icon:'icon-192.png'});
    }catch(e){}
    setupRemind();
  }, ms);
}
function checkInAppRemind(){
  const r=$('remindBar'); if(!r) return;
  if(!S.profile.remindOn){ r.style.display='none'; return; }
  if(S.lastRemind===todayStr() || !todayUnrecorded()){ r.style.display='none'; return; }
  const h=new Date().getHours();
  if(h < (+S.profile.remindH||21)){ r.style.display='none'; return; }
  r.style.display='flex';
  S.lastRemind=todayStr(); save();
}
function dismissRemind(){
  const r=$('remindBar'); if(r) r.style.display='none';
  S.lastRemind=todayStr(); save();
}
function askRemind(){
  if(!('Notification' in window)){ toast('本设备不支持系统通知，但应用内提醒已启用','warn'); return; }
  Notification.requestPermission().then(p=>{
    if(p==='granted'){ S.profile.remindOn=true; save(); setupRemind(); toast('每日 '+S.profile.remindH+' 点系统提醒已开','warn'); renderSettings(); }
    else toast('未授权系统通知，应用内提醒仍可用','warn');
  });
}
/** 本月未记账的天数 */
function todayUnrecorded(){
  const m=curM();
  const days=(m===curM())? +todayStr().slice(8,10) : daysIn(m);
  const set={};
  recsOf(m).forEach(r=>{ set[+r.d.slice(8,10)]=1; });
  let c=0; for(let i=1;i<=days;i++) if(!set[i]) c++;
  return c;
}

/* ---------- Toast ---------- */
let toastT=null;
function toast(msg,type){
  const el=$('toast'); if(!el) return;
  el.textContent=msg;
  el.className='toast on'+(type?' '+type:'');
  if(toastT) clearTimeout(toastT);
  toastT=setTimeout(()=>{ el.className='toast'+(type?' '+type:''); }, 2600);
}
/* =========================================================
   渲染层
   ========================================================= */
function renderAll(){ renderHUD(); renderPage(); }

/* ---------- HUD ---------- */
function renderHUD(){
  const inc=monthIncome(), bs=bucketSpend(), fx=monthFixed();
  const disp=dispIncome(), left=leftOver();
  const used=bs.necessity+bs.freedom+bs.shortsave;
  const pct=disp>0? Math.min(100, Math.round(used/disp*100)) : 0;

  $('hudMonth').textContent=mLabel(viewM);
  $('hudCur').textContent=mLabel(viewM);

  // 三态：真超支(红) / 动用补贴中(紫) / 正常(青→黄)
  const sub=monthSubsidy(), subUsed=subsidyUsed(), ro=realOver();
  const stCol = ro>0 ? '#FF2E88' : (subUsed>0 ? '#B06BFF' : (pct>=80?'#FFD60A':'#00E5FF'));
  const stGlow= ro>0 ? 'rgba(255,46,136,.7)' : (subUsed>0 ? 'rgba(176,107,255,.7)' : (pct>=80?'rgba(255,214,10,.7)':'rgba(0,229,255,.7)'));

  const C=2*Math.PI*35;
  const arc=$('ringArc');
  arc.setAttribute('stroke-dasharray',C.toFixed(1));
  arc.setAttribute('stroke-dashoffset',(C*(1-Math.min(1,used/(disp||1)))).toFixed(1));
  arc.setAttribute('stroke', stCol);
  arc.style.filter='drop-shadow(0 0 5px '+stGlow+')';
  $('ringPct').textContent=pct+'%';
  $('ringPct').style.color = stCol;
  $('ringLbl').textContent = ro>0?'已超支' : (subUsed>0?'动用补贴中' : (disp>0?'预算已用':'待记收入'));

  const le=$('hudLeft');
  le.textContent= (disp>0||sub>0)? money(left) : '—';
  le.className='v big num'+(ro>0?' over':'');
  $('hudInc').textContent= money(inc);
  $('hudOut').textContent= money(used+fx);

  // 三桶进度
  const bud=budgets();
  $('hudBars').innerHTML=BUCKETS.map(b=>{
    const budget=bud[b.k]||0, spent=bs[b.k]||0;
    const p=budget>0? Math.min(100,Math.round(spent/budget*100)) : (spent>0?100:0);
    const col= p>=100?'#FF2E88' : (p>=80?'#FFD60A':b.c);
    return '<div class="hb" onclick="go(\'budget\')">'+
      '<div class="hb-t"><span>'+b.n+'</span><b style="color:'+col+'">'+p+'%</b></div>'+
      '<div class="hb-b"><div class="hb-f" style="width:'+p+'%;background:'+col+';box-shadow:0 0 8px '+col+'"></div></div></div>';
  }).join('');
}

function shiftMonth(d){

}

/* ---------- 页切换 ---------- */
function go(tab){
  curTab=tab; S.tab=tab;
  ['record','budget','invest','analysis'].forEach(t=>{
    const el=$('page-'+t); if(el) el.style.display = (t===tab?'':'none');
  });
  document.querySelectorAll('.tabbar button').forEach(b=>{
    b.classList.toggle('on', b.getAttribute('data-tab')===tab);
  });
  const sc=$('scroll'); if(sc) sc.scrollTop=0;
  renderPage();
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){}
}
function renderPage(){
  if(curTab==='record') renderRecord();
  else if(curTab==='budget') renderBudget();
  else if(curTab==='invest') renderInvest();
  else renderAnalysis();
}

/* ---------- 记账页 ---------- */
function renderRecord(){
  const m=viewM, rs=recsOf(m).slice().sort((a,b)=>a.d<b.d?1:(a.d>b.d?-1:(b.ts||0)-(a.ts||0)));
  let h='';

  // 快捷模板
  const tpls=topTpls();
  if(tpls.length){
    h+='<div class="card" style="padding-bottom:9px"><div class="c-head"><div class="c-title">QUICK / 常记</div>'+
       '<div class="c-sub">点一下直接记</div></div><div class="hscroll">'+
       tpls.map((t,i)=>'<div class="tpl" onclick="useTpl('+i+')">'+
         '<div class="tn">'+esc(t.note)+'</div>'+
         '<div class="tv">'+fmt(t.amt)+'</div>'+
         (t.pin?'<div class="tn" style="color:var(--ye);font-size:9px">★ 固定</div>':'')+
       '</div>').join('')+'</div></div>';
  }

  // 周期项待办
  const rs2=recurStatus().filter(x=>x.pending);
  if(rs2.length){
    h+='<div class="card" style="border-color:rgba(255,214,10,.4)"><div class="c-head">'+
      '<div class="c-title" style="color:var(--ye);text-shadow:0 0 9px rgba(255,214,10,.4)">DUE / 待记周期项</div></div>'+
      rs2.map(x=>'<div class="rec-item"><div class="ri-m"><div class="a">'+esc(x.it.note||cat(x.it.cat).n)+'</div>'+
        '<div class="b todo">每月 '+x.it.day+' 日 · '+money(x.it.amt)+'</div></div>'+
        '<button class="btn sm" onclick="doRecur(\''+x.it.id+'\')">记账</button></div>').join('')+
      '</div>';
  }

  if(!rs.length){
    h+='<div class="empty"><div class="e-ic">▤</div>本月还没有记录<br><span style="font-size:11.5px;color:var(--txt3)">点右下角 ⊕ 记第一笔</span></div>';
  }else{
    // 按日分组
    const g={}; rs.forEach(r=>{ (g[r.d]=g[r.d]||[]).push(r); });
    const days=Object.keys(g).sort().reverse();
    days.forEach(d=>{
      const daySum=g[d].reduce((s,r)=>s+(r.cat==='income'?0:(+r.amt||0)),0);
      h+='<div class="daygrp"><div class="dh">'+d.slice(5).replace('-','/')+' · '+weekday(d)+
         '<em>支出 '+money(daySum)+'</em></div>';
      g[d].forEach(r=>{
        const c=cat(r.cat), isInc=c.sign>0;
        h+='<div class="rec-row" data-id="'+r.id+'"><div class="rec-in" onclick="editRec(\''+r.id+'\')">'+
          '<div class="rec-ic" style="background:'+hexa(c.c,.14)+';color:'+c.c+'">'+svg(c.i,17,c.c)+'</div>'+
          '<div class="rec-mid"><div class="t1">'+esc(r.note||c.n)+(r.auto?' <span class="tag" style="color:var(--ye);font-size:8.5px">AUTO</span>':'')+'</div>'+
          '<div class="t2">'+esc(c.n)+(r.inv?(' · '+esc(r.inv)+(r.op==='redeem'?' 赎回':' 买入')):'')+'</div></div>'+
          '<div class="rec-amt" style="color:'+(isInc?'var(--gr)':'var(--txt)')+'">'+(isInc?'+':'−')+fmt(r.amt)+'</div>'+
          '</div><div class="rec-del" onclick="delRec(\''+r.id+'\')">删除</div></div>';
      });
      h+='</div>';
    });
  }
  $('page-record').innerHTML=h;
  bindSwipe();
}
function weekday(d){
  const w=['日','一','二','三','四','五','六'];
  return '周'+w[new Date(d).getDay()];
}
function hexa(hex,a){
  const h=hex.replace('#','');
  const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}

/* ---------- 预算页 ---------- */
function renderBudget(){
  const inc=monthIncome(), fx=monthFixed(), disp=dispIncome();
  const bs=bucketSpend(), bud=budgets();
  let h='';

  // 可支配收入
  const ob=(typeof S.openBal[viewM]==='number'?S.openBal[viewM]:openBal(viewM));
  const obAuto=(typeof S.openBal[viewM]!=='number');

function pctSum(){ return BUCKETS.reduce((s,b)=>s+(+S.pcts[b.k]||0),0); }
function onPct(k,v){
  S.pcts[k]=clampPct(v);
  const el=$('pv-'+k); if(el) el.textContent=S.pcts[k]+'%';
  const s=$('pctSum'); if(s){ s.textContent=pctSum(); s.style.color=pctSum()===100?'var(--cy)':'var(--ye)'; }
  save(); renderHUD();
}
function normPcts(){
  const s=pctSum(); if(!s){ S.pcts={necessity:65,freedom:10,shortsave:25}; }
  else BUCKETS.forEach(b=>{ S.pcts[b.k]=Math.round((+S.pcts[b.k]||0)/s*100); });
  // 修正舍入尾差
  const d=100-pctSum();
  if(d) S.pcts[BUCKETS[0].k]=clampPct((+S.pcts[BUCKETS[0].k]||0)+d);
  save(); renderBudget(); renderHUD(); toast('已归一到 100%');
}
function resetPcts(){ S.pcts={necessity:65,freedom:10,shortsave:25}; save(); renderBudget(); renderHUD(); toast('已恢复默认比例'); }
function setOpenBal(v){
  S.openBal[viewM]=parseFloat(v)||0;
  save(); renderBudget(); renderHUD(); renderAnalysis&&renderAnalysis();
  toast('期初余粮 '+money(S.openBal[viewM])+'，预算已重算');
}

/** 由买入/赎回记录算出的成本（不含手动覆盖） */
function buyCost(name){
  let cost=0, out=0;
  S.recs.forEach(r=>{
    if(r.cat!=='fixednc'||r.inv!==name) return;
    if(r.op==='redeem') out+=(+r.amt||0); else cost+=(+r.amt||0);
  });
  return Math.max(0, cost-out);
}
function saveHolding(name){
  const cRaw=($('hdCost')||{}).value;
  const mv=parseFloat(($('hdMv')||{}).value);
  if(isNaN(mv)||mv<0){ toast('市值要填有效金额','warn'); return; }
  S.invVal=S.invVal||{}; S.invVal[name]=mv;
  S.invCost=S.invCost||{};
  if(String(cRaw).trim()==='') delete S.invCost[name];
  else{
    const c=parseFloat(cRaw);
    if(isNaN(c)||c<0){ toast('成本要填有效金额','warn'); return; }
    S.invCost[name]=c;
  }
  save(); closeModal(); renderInvest(); renderHUD();
  const g=holdings()[name];
  const gainTxt = g.costKnown && g.rate!==null ? (' · 收益 '+(g.gain>0?'+':'')+fmt(g.gain)) : (g.costKnown?' · 收益 0':' · 只追踪市值');
  toast(name+' 已更新 · 市值 '+money(mv)+gainTxt);
}
function delHolding(name){
  if(!confirm('删除持仓「'+name+'」？只会清掉成本与市值设置，买入记录仍保留。')) return;
  S.invCost=S.invCost||{}; S.invVal=S.invVal||{};
  delete S.invCost[name]; delete S.invVal[name];
  save(); closeModal(); renderInvest(); renderHUD(); toast('已清除 '+name);
}

/* ---------- 建议引擎（规则） ---------- */
function advice(){
  const out=[];
  const m=viewM, inc=monthIncome(), bs=bucketSpend(), bud=budgets();
  const disp=dispIncome(), used=bs.necessity+bs.freedom+bs.shortsave;
  // 补贴能接住超支时，别再用"超支"的口吻吓人
  const aSub=monthSubsidy(m), aUsed=subsidyUsed(m), aRo=realOver(m);
  const softened = aUsed>0 && aRo<=0;

  if(!inc){
    out.push(ins('warn','SETUP','本月还没有收入记录，预算算不出来。去记一笔收入，三桶预算会立刻按它算好。'));
  }
  // 超支桶
  BUCKETS.forEach(b=>{
    const budget=bud[b.k]||0, spent=bs[b.k]||0;
    if(budget>0 && spent>budget){
      out.push(ins(softened?'warn':'bad','OVER',b.n+'已超支 '+money(spent-budget)+'（用了预算的 '+Math.round(spent/budget*100)+'%）。'+
        (b.k==='shortsave'?'储蓄转出超额其实不是坏事，但别影响必要开支。':
         b.k==='freedom'?'剩下的日子先压一压，或把它挪到下个月的额度里。':
         '看看是不是一次性大额支出，如果是，下次可以提前单列预算。'))+
        (softened?'<span style="color:var(--pu)">这部分被家里的补贴补上了，本月没有真超支。</span>':''));
    }else if(budget>0 && spent/budget>=0.85){
      out.push(ins('warn','NEAR',b.n+'已用掉 '+Math.round(spent/budget*100)+'%，还剩 '+money(budget-spent)+'。'));
    }
  });
  // 储蓄率
  if(inc>0){
    const sr=saveRate();
    if(sr<0){
      if(softened) out.push(ins('warn','SUPPORT','工资不够花，靠家里补贴 '+money(aUsed)+' 才持平。本月账是平的，但缺口是真实存在的。'));
      else if(aRo>0) out.push(ins('bad','NEG','本月支出已超过活钱加补贴，动用了存量的钱。'));
      else out.push(ins('bad','NEG','本月支出已超过活钱，动用了存量的钱。'));
    }
    else if(sr<0.1) out.push(ins('warn','LOW','储蓄率只有 '+(sr*100).toFixed(1)+'%，低于 10% 的安全线。优先补「短期储蓄」那一桶。'));
    else if(sr>=0.3) out.push(ins('good','GOOD','储蓄率 '+(sr*100).toFixed(1)+'%，很稳。可以考虑把多余部分转去长期投资。'));
  }
  // 固定占比
  if(inc>0 && fixedBase(m)/inc>0.5){
    out.push(ins('warn','FIXED','固定/投资占了活钱的 '+Math.round(fixedBase(m)/inc*100)+'%，可支配空间被压得比较紧。'));
  }
  // 连续超支
  let over=0;
  for(let i=0;i<3;i++){
    const mm=addMonth(m,-i);
    const b=bucketSpend(mm), d=dispIncome(mm);
    // 只算补贴兜不住的真超支，动用补贴本身不算
    if(d>0 && Math.max(0,(b.necessity+b.freedom+b.shortsave)-d-monthSubsidy(mm))>0) over++;
  }
  if(over>=2) out.push(ins('bad','TREND','近 '+over+' 个月都超支了，问题多半不在「花太多」，而是预算基数没对齐真实收入。建议调低固定计划或重设比例。'));
  // 理财
  const t=invTotal();
  if(t.n>0){
    const anyNoMv=Object.keys(holdings()).some(k=>!(S.invVal&&typeof S.invVal[k]==='number'));
    if(anyNoMv) out.push(ins('warn','INVEST','有持仓还没填过市值，收益显示的是成本。点「市值」补一下，收益才真实。'));
    if(t.rate<-0.1) out.push(ins('bad','LOSS','整体浮亏 '+(t.rate*100).toFixed(1)+'%。如果是长期定投，别在这个点赎回。'));
    if(t.rate>0.15) out.push(ins('good','GAIN','整体浮盈 '+(t.rate*100).toFixed(1)+'%。可以考虑分批止盈，落袋为安。'));
  }
  // 记账习惯
  const unt=todayUnrecorded();
  if(unt>3 && m===curM()) out.push(ins('warn','HABIT','本月还有 '+unt+' 天没记账，回忆成本会越来越高。开个每日提醒会好很多。'));
  // 周期项缺失
  const hasRent=(S.recur||[]).some(r=>r.on);
  if(!hasRent && inc>0) out.push(ins('warn','RECUR','还没设周期项。房租、订阅、定投这类每月固定的，设一次就不用重复记了。'));

  if(!out.length) out.push(ins('good','OK','各项指标正常，保持住。'));
  return out;
}
function ins(type,tag,body){
  const names={warn:'注意',bad:'预警',good:'良好',info:'提示'};
  const colors={warn:'var(--ye)',bad:'var(--mg)',good:'var(--gr)',info:'var(--cy)'};
  return '<div class="ins '+(type||'')+'"><div class="h" style="color:'+colors[type||'info']+'">'+
    '<em>'+(tag||'TIP')+'</em>'+names[type||'info']+'</div><div class="b">'+body+'</div></div>';
}

/* ---------- SVG 图表 ---------- */
function svgTrend(rows){
  const W=318,H=134,PL=8,PR=8,PB=24,PT=12;
  const max=Math.max(1,...rows.map(r=>Math.max(r.inc,r.out)));
  const n=rows.length, gw=(W-PL-PR)/n, bw=Math.min(15,gw/3.2);
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="134" preserveAspectRatio="xMidYMid meet">';
  // 网格
  for(let i=0;i<=3;i++){
    const y=PT+(H-PT-PB)*i/3;
    s+='<line x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'" stroke="#1a2739" stroke-width="1"/>';
  }
  rows.forEach((r,i)=>{
    const cx=PL+gw*i+gw/2;
    const hi=(H-PT-PB)*(r.inc/max), ho=(H-PT-PB)*(r.out/max);
    const y0=H-PB;
    s+='<rect x="'+(cx-bw-1.5)+'" y="'+(y0-hi)+'" width="'+bw+'" height="'+Math.max(1,hi)+'" rx="2" fill="#00FFA3" opacity="'+(i===n-1?'.95':'.55')+'"/>';
    s+='<rect x="'+(cx+1.5)+'" y="'+(y0-ho)+'" width="'+bw+'" height="'+Math.max(1,ho)+'" rx="2" fill="#FF2E88" opacity="'+(i===n-1?'.95':'.55')+'"/>';
    s+='<text x="'+cx+'" y="'+(H-7)+'" fill="#55698A" font-size="9.5" text-anchor="middle" font-family="ui-monospace,monospace">'+(+r.m.slice(5,7))+'月</text>';
    if(i===n-1) s+='<text x="'+cx+'" y="'+(PT-2)+'" fill="#8CA3C0" font-size="9" text-anchor="middle" font-family="ui-monospace,monospace">'+fmt(r.inc)+'</text>';
  });
  s+='</svg>';
  return s;
}
function svgDonut(items,total){
  const S1=112, cx=56, cy=56, r=41, sw=15;
  const C=2*Math.PI*r;
  let off=0, s='<svg viewBox="0 0 '+S1+' '+S1+'" width="112" height="112" style="flex:none">';
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#141d2b" stroke-width="'+sw+'"/>';
  items.forEach(x=>{
    const frac=total? x.v/total : 0;
    const len=C*frac;
    if(len<=0) return;
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+x.c+'" stroke-width="'+sw+'" '+
       'stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" '+
       'transform="rotate(-90 '+cx+' '+cy+')" style="filter:drop-shadow(0 0 4px '+x.c+'66)"/>';
    off+=len;
  });
  s+='<text x="'+cx+'" y="'+(cy-2)+'" fill="#E8F2FF" font-size="15" text-anchor="middle" font-family="ui-monospace,monospace" font-weight="600">'+fmt(total)+'</text>';
  s+='<text x="'+cx+'" y="'+(cy+13)+'" fill="#55698A" font-size="8.5" text-anchor="middle" font-family="ui-monospace,monospace" letter-spacing="1">TOTAL</text>';
  s+='</svg>';
  return s;
}

function saveAndNext(){
  const amt=parseFloat(sh.amt||'0');
  if(!(amt>0)){ toast('先输入金额','warn'); return; }
  const note=String(sh.note||'').trim();
  const date=sh.date||todayStr();
  const rec={id:sh.editId||uid(), d:date, amt:Math.round(amt*100)/100, note:note, ts:Date.now()};

  if(sh.mode===2){
    if(!sh.inv){ toast('先选产品','warn'); return; }
    rec.cat='fixednc'; rec.inv=sh.inv;
    if(sh.op==='mv'){
      S.invVal=S.invVal||{}; S.invVal[sh.inv]=amt;
      save(); closeAll(); renderAll();
      toast(sh.inv+' 市值已更新为 '+money(amt)); return;
    }
    rec.op = sh.op==='redeem'?'redeem':'buy';
    rec.note = note || (sh.inv+(rec.op==='redeem'?' 赎回':' 买入'));
  }else if(sh.mode===1){
    rec.cat='income'; rec.it=sh.incType;
    if(sh.incType==='invest') rec.inv=sh.inv||'';
  }else{
    rec.cat=sh.cat;
    if(note) smartLearn(note, sh.cat);
  }

  if(sh.editId){
    const i=S.recs.findIndex(r=>r.id===sh.editId);
    if(i>=0) S.recs[i]=Object.assign({},S.recs[i],rec);
    save(); closeAll(); renderAll(); toast('已更新'); return;
  }
  S.recs.push(rec);
  save();
  // 超预算即时提醒
  const bs=bucketSpend(), bud=budgets();

/* ---------- 滑动删除 ---------- */
let swipeBound=false;
function bindSwipe(){
  const rows=document.querySelectorAll('.rec-row');
  if(!swipeBound){
    swipeBound=true;
    document.addEventListener('touchstart',e=>{
      if(!e.target.closest||!e.target.closest('.rec-row'))
        document.querySelectorAll('.rec-row.sliding').forEach(r=>r.classList.remove('sliding'));
    },{passive:true});
  }
  rows.forEach(row=>{
    let sx=0, sy=0, cur=false, veto=false;
    row.addEventListener('touchstart',e=>{
      const t=e.touches[0]; sx=t.clientX; sy=t.clientY; cur=true; veto=false;
    },{passive:true});
    row.addEventListener('touchmove',e=>{
      if(!cur||veto) return;
      const t=e.touches[0], dx=t.clientX-sx, dy=t.clientY-sy;
      // 明显是上下滚动时，本次 touch 不再响应左右滑
      if(Math.abs(dy)>10 && Math.abs(dy)>Math.abs(dx)){ veto=true; return; }
      // 阈值 40px，避免轻微误触
      if(Math.abs(dx)<40) return;
      if(dx<-40){ row.classList.add('sliding'); }
      else if(dx>40){ row.classList.remove('sliding'); }
    },{passive:true});
    row.addEventListener('touchend',()=>{
      document.querySelectorAll('.rec-row.sliding').forEach(r=>{ if(r!==row) r.classList.remove('sliding'); });
      cur=false;
    });
    row.addEventListener('touchcancel',()=>{ cur=false; });
  });
}

/** 合并分类：以内置/预置定义打底，只覆盖用户改过的字段。
 *  关键：不能用 Object.assign(base.cats, 旧cats) 整体覆盖 —— 那会把 bk(桶归属)/
 *  sign(收支方向)/c(颜色)/i(图标) 冲掉，导致支出统计为 0、分类还不显示在记账面板。 */
function mergeCats(base, incoming){
  const out=Object.assign({}, base);
  const FALLBACK={n:'未分类', c:'#55698A', i:'spark', sign:-1, bk:''};
  Object.keys(incoming||{}).forEach(k=>{
    const inc=incoming[k];
    if(!inc || typeof inc!=='object') return;
    const proto=out[k] || SYS_CATS[k] || FALLBACK;
    out[k]=Object.assign({}, proto, inc);
    // 兜底：支出分类没桶就归「衣食住行」，否则这笔钱不进任何桶 → 支出统计为 0
    if(out[k].sign===-1 && !out[k].bk) out[k].bk='necessity';
  });
  return out;
}

const SELF_KEY='wb_cyber_v1';
const LEGACY_KEYS=['wb_wagebook_v1','wb_wagebook_v2','wb_wagebook','wagebook_v1','wb_book_v1','wb_cyber_v0'];
/** 判断一个对象是否像账本，是则返回记录条数 */
function probeLedger(d){
  if(!d || typeof d!=='object') return 0;
  const arr = Array.isArray(d.records)? d.records : (Array.isArray(d.recs)? d.recs : null);
  if(!arr || !arr.length) return 0;
  for(let i=0;i<Math.min(arr.length,30);i++){
    const r=arr[i];
    if(r && typeof r==='object' && (r.date||r.d) && (r.amount!==undefined||r.amt!==undefined)) return arr.length;
  }
  return 0;
}
/** 扫遍 localStorage，列出所有疑似账本（按条数从多到少） */
function scanCandidates(){
  const out=[];
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(!k || k===SELF_KEY) continue;
      let d=null;
      try{ d=JSON.parse(localStorage.getItem(k)); }catch(e){ continue; }
      const n=probeLedger(d);
      if(n) out.push({key:k, n:n, data:d});
    }
  }catch(e){}
  out.sort((a,b)=>b.n-a.n);
  return out;
}
function findCand(k){
  try{
    const d=JSON.parse(localStorage.getItem(k));
    const n=probeLedger(d);
    return n?{key:k,data:d,n:n}:null;
  }catch(e){ return null; }
}
function detectLegacy(){
  for(let i=0;i<LEGACY_KEYS.length;i++){
    const c=findCand(LEGACY_KEYS[i]);
    if(c) return c;
  }
  const c=scanCandidates();
  return c.length? c[0] : null;
}

/** 强制拉最新版：清掉离线缓存 + 注销旧 sw + 重载。
 *  注意只动缓存和 sw，不碰 localStorage，账目数据不会丢。 */
function forceUpdate(){
  if(!confirm('清掉离线缓存并重新加载？\n只清缓存，你的记账数据不受影响。')) return;
  const jobs=[];
  if('caches' in window){
    jobs.push(caches.keys().then(ks=>Promise.all(ks.map(k=>caches.delete(k)))).catch(()=>{}));
  }
  if('serviceWorker' in navigator){
    jobs.push(navigator.serviceWorker.getRegistrations()
      .then(rs=>Promise.all(rs.map(r=>r.unregister()))).catch(()=>{}));
  }
  Promise.all(jobs).then(()=>{
    // 加时间戳绕开一切中间缓存
    try{ location.replace(location.pathname+'?fresh='+Date.now()); }
    catch(e){ location.reload(); }
  });
}

  var need={c_food:{n:'餐饮',c:'#00E5FF',i:'bowl',sign:-1,bk:'necessity'},c_traffic:{n:'交通',c:'#FFD60A',i:'car',sign:-1,bk:'necessity'},c_shop:{n:'购物',c:'#FF2E88',i:'bag',sign:-1,bk:'necessity'},c_live:{n:'居住',c:'#00FFA3',i:'home',sign:-1,bk:'necessity'},c_fun:{n:'娱乐',c:'#B06BFF',i:'game',sign:-1,bk:'freedom'},c_health:{n:'医疗健康',c:'#FF8A3D',i:'heart',sign:-1,bk:'necessity'},c_ai:{n:'AI/充值',c:'#00E5FF',i:'spark',sign:-1,bk:'necessity'},c_sub:{n:'订阅/会员',c:'#FF8A3D',i:'star',sign:-1,bk:'fixednc'},c_pet:{n:'宠物',c:'#FFD60A',i:'heart',sign:-1,bk:'fixednc'},c_family:{n:'给家里',c:'#FF4D4D',i:'heart',sign:-1,bk:'fixednc'},c_edu:{n:'学习',c:'#00E5FF',i:'book',sign:-1,bk:'freedom'},c_gift:{n:'人情往来',c:'#FF2E88',i:'gift',sign:-1,bk:'freedom'}};
  Object.keys(need).forEach(function(k){ if(!S.cats[k]) S.cats[k]=need[k]; });
  // 2. 记录归细类（原大类 → 细类）
  S.recs.forEach(function(r){
    if(r.cat && BUCK[r.cat] && !r._fine){
      var f=r.note&&S.smart&&S.smart[r.note]&&!BUCK[S.smart[r.note]]?S.smart[r.note]:_fineOf(r.note);
      if(f && S.cats[f]) r.cat=f;
    }
  });
  // 3. smart 映射升级到大类→细类
  Object.keys(S.smart||{}).forEach(function(note){
    var c=S.smart[note];
    if(c && BUCK[c]){ var f=_fineOf(note); if(f) S.smart[note]=f; }
  });
  S.v=3; save();
}

/* ---------- 预算驾驶舱 v3.2（口径修正: 本月零花, 不含上月结余; 发薪日后算到下次发薪） ---------- */
window.daysToPayday=function(m){
  m=m||viewM;
  var p=paydayFor(m);            /* 本月发薪日(已含节假日提前) */
  var today=todayStr();
  if(today>=p){                  /* 已到/过本月发薪 → 距下次发薪(今天发薪即进入新周期) */
    var p2=paydayFor(addMonth(m,1));
    var n2=Math.round((new Date(p2)-new Date(today))/86400000);
    return n2>=0?n2:0;
  }
  var n=Math.round((new Date(p)-new Date(today))/86400000);
  return n>=0?n:0;
};
function dailyCockpit(){
  try{
    var inc=monthIncome(), fx=monthFixed();
    var bs=bucketSpend();
    var sub=monthSubsidy();
    /* 本月零花 = 活钱 + 补贴 − 固定/投资 − 生活已花(衣食+娱乐)  [不含上月结转 openBal] */
    var left=inc+sub-fx-(bs.necessity+bs.freedom);
    var toPay=daysToPayday(viewM);
    var denom=Math.max(1,(toPay>0?toPay:1));
    var daily=left/denom;
    return {inc:inc,fx:fx,left:left,toPay:toPay,daily:daily,spent:bs.necessity+bs.freedom};
  }catch(e){ return null; }
}
function dailyCardHTML(){
  var c=dailyCockpit(); if(!c) return '';
  var leftCls=c.left>=0?'gr':'mg', dailyCls=c.daily>=0?'cy':'mg';
  return '<div class="card" style="border-color:rgba(0,255,163,.25)"><div class="c-head"><div class="c-title">TODAY / 本月零花</div>'+
    '<div class="c-sub">活钱−固定−生活已花 · 到下次发薪 '+c.toPay+' 天</div></div>'+
    '<div class="ck-daily">'+
    '<div class="ck-cell '+leftCls+'"><div class="k">零花剩余</div><div class="v">'+money(c.left)+'</div></div>'+
    '<div class="ck-cell '+dailyCls+'"><div class="k">日均可花</div><div class="v">'+money(c.daily)+'</div></div>'+
    '<div class="ck-cell ye"><div class="k">生活已花</div><div class="v">'+money(c.spent)+'</div></div>'+
    '<div class="ck-cell gr"><div class="k">下次发薪</div><div class="v">'+c.toPay+'天后</div></div></div>'+
    '<div style="font-size:10.5px;color:var(--txt3);margin-top:2px">零花=本月到手'+money(c.inc)+'−固定'+money(c.fx)+'−已花（上月结余不算进来）</div>'+
    (c.daily<0?'<div style="font-size:11.5px;color:var(--mg)">零花已为负——超支了，需要压缩接下来支出。</div>':'')+
    '</div>';
}

/* ================================================================
   打工人小账本 v3.0 PATCH — UI (rev2)
   两级分类 / 备注联想 / 弹性周期项(genRecur+doRecur 完整重写) / 跳过本月
   ================================================================ */
(function(){
var mCur=function(){return curM();};
var mKey=function(s){return String(s||'').slice(0,7);};
/* ---------- A. 两级分类 ---------- */
var BKTABS=[
  {k:'necessity',n:'生活'},{k:'freedom',n:'娱乐'},
  {k:'fixednc',n:'固定储蓄'},{k:'shortsave',n:'短储'}
];
function fineOf(bk){
  var ks=[bk];
  Object.keys(S.cats).forEach(function(k){
    if(k===bk||k==='income') return;
    var c=S.cats[k];
    if(c.sign===-1&&c.bk===bk) ks.push(k);
  });
  return ks;
}
window.renderCatPick=function(){
  if(sh.mode===1){
    var EXT=INC_TYPES.concat([{k:'refund',n:'家人返钱'}]);
    var ob=$('catPick');
    if(ob) ob.innerHTML=EXT.map(function(tp){return '<div class="chip '+(sh.incType===tp.k?'on':'')+'" onclick="pickIncType(\''+tp.k+'\')">'+(tp.k==='external'||tp.k==='invest'||tp.k==='refund'?'⤳ ':'')+tp.n+'</div>';}).join('');
    var hn=$('incHint'); if(hn){ renderIncHint(); }
    return;
  }
  if(!sh.bk) sh.bk='necessity';
  var cur=S.cats[sh.cat]||{};
  if(sh.cat&&cur.bk&&cur.bk!==sh.bk) sh.bk=cur.bk;
  var box=$('catPick'); if(!box) return;
  var COL={'necessity':'#00E5FF','freedom':'#FF2E88','fixednc':'#FF8A3D','shortsave':'#B06BFF'};
  var h='<div class="bktab">'+BKTABS.map(function(b){
    var on=sh.bk===b.k,col=COL[b.k];
    return '<div class="b '+(on?'on':'')+'" style="'+(on?'background:'+col+'': '')+'" onclick="pickBk(\''+b.k+'\')">'+b.n+'</div>';
  }).join('')+'</div>';
  h+='<div class="hscroll" style="margin-bottom:0">'+fineOf(sh.bk).map(function(k){
    var c=S.cats[k],on=sh.cat===k;
    return '<div class="chip '+(on?'on':'')+'" onclick="pickCat(\''+k+'\')">'+
      '<span class="dot" style="background:'+c.c+';box-shadow:0 0 6px '+c.c+'"></span>'+esc(c.n)+'</div>';
  }).join('')+'</div>';
  box.innerHTML=h;
};
window.pickBk=function(bk){ sh.bk=bk; var f=fineOf(bk); sh.cat=f[0]||bk; renderCatPick(); };

/* ---------- B. 备注联想 ---------- */
function noteCandidates(note){
  note=String(note||'').trim(); if(note.length<1) return [];
  var out=[],seen={},push=function(cd){ if(!seen[cd.cat]){ seen[cd.cat]=1; out.push(cd);} };
  Object.keys(S.smart||{}).forEach(function(k){
    if(out.length>=4) return;
    if(note===k||(k.length>=2&&note.indexOf(k)>=0)) push({note:k,cat:S.smart[k],hit:4});
  });
  var cut=addMonth(mCur(),-3);
  S.recs.forEach(function(r){
    if(out.length>=4) return;
    if(String(r.d)>=cut&&r.note&&r.note.indexOf(note)>=0&&r.cat!=='income') push({note:r.note,cat:r.cat,hit:2});
  });
  var fine=(typeof _fineOf==='function')?_fineOf(note):null;
  if(fine&&S.cats[fine]) push({note:note,cat:fine,hit:1});
  return out.slice(0,4);
}
window.renderSmartHint=function(){
  var el=$('smartHint'); if(!el) return;
  var note=String(sh.note||'').trim();
  if(!note){ el.innerHTML=''; return; }
  var cand=noteCandidates(note), g=smartGuess(note);
  var curN=S.cats[sh.cat]?esc(S.cats[sh.cat].n):'';
  var h='';
  if(cand.length){
    h+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">'+cand.map(function(cd){
      var c=S.cats[cd.cat]||{n:'?',c:'#888',bk:''};
      return '<div class="sug-row" style="border-color:'+(g&&g.cat===cd.cat?'rgba(0,255,163,.5)':'var(--line2)')+'" '+
        'onclick="applyNoteCat(\''+cd.cat+'\')"><span class="sn" style="color:'+c.c+'">'+esc(cd.note)+' → '+esc(c.n)+'</span><span class="sv">选</span></div>';
    }).join('')+'</div>';
  }
  if(g){ h+='<div style="margin-top:6px;font-size:11px;color:var(--txt3)">✓ 按记忆选：<b style="color:var(--gr)">'+curN+'</b> · <span onclick="delSmart(\''+esc(sh.note)+'\');renderSmartHint()">忘记</span></div>'; }
  else if(note.length>=2&&!cand.length){ h+='<div style="margin-top:6px;font-size:11px;color:var(--txt3)">保存后记住「'+esc(note)+' → '+curN+'」</div>'; }
  el.innerHTML=h;
};
window.applyNoteCat=function(k){
  if(!S.cats[k]) return;
  sh.cat=k; var c=S.cats[k]; if(c.bk) sh.bk=c.bk;
  renderCatPick(); renderSmartHint();
  toast('已选：'+c.n);
};
window.onNoteInput=function(){
  sh.note=$('noteIn').value;
  var g=smartGuess(sh.note);
  if(g&&!sh.editId){ sh.cat=g.cat; var c=S.cats[g.cat]; if(c&&c.bk) sh.bk=c.bk; }
  renderCatPick(); renderSmartHint();
};

/* ---------- D. 弹性周期项: genRecur / doRecur 完整重写 ---------- */
window.genRecur=function(silent){
  var m=curM(), today=+todayStr().slice(8,10), made=0,names=[];
  (S.recur||[]).forEach(function(it){
    if(!it.on) return;
    if(it.skipM&&it.skipM.indexOf(m)>=0){ it.last=m; return; }   /* 跳过本月 */
    if(it.last===m) return;
    if(today < (+it.day||1)) return;
    if(S.recs.some(function(r){return r.rid===it.id&&mKey(r.d)===m;})){ it.last=m; return; }
    if(it.flex){ it.last=m; return; }                              /* 弹性: 待手动确认金额 */
    var d=m+'-'+pad(Math.min(+it.day||1,daysIn(m)));
    S.recs.push({id:uid(),d:d,cat:it.cat,amt:+it.amt||0,note:it.note||cat(it.cat).n,ts:Date.now(),rid:it.id,auto:1});
    it.last=m; made++; names.push((it.note||cat(it.cat).n)+' '+money(it.amt));
  });
  if(made){ save(); if(!silent) toast('已自动记账 '+made+' 笔：'+names.slice(0,2).join('、')+(made>2?' 等':'')); }
  return made;
};
window.doRecur=function(id){
  var it=(S.recur||[]).find(function(x){return x.id===id;}); if(!it) return;
  var amt=+it.amt||0;
  if(it.flex){
    var v=prompt('「'+(it.note||cat(it.cat).n)+'」本月实际金额', amt||'');
    if(v==null) return;
    amt=parseFloat(v)||0;
    if(!(amt>0)){ toast('金额无效','warn'); return; }
  }
  var d=viewM+'-'+pad(Math.min(+it.day||1,daysIn(viewM)));
  S.recs.push({id:uid(),d:d,cat:it.cat,amt:Math.round(amt*100)/100,note:it.note||cat(it.cat).n,ts:Date.now(),rid:it.id});
  it.last=viewM; save(); genRecur(true); renderPage(); renderHUD();
  toast('已记 '+money(amt)+(it.flex?'（弹性）':''));
};
/* 编辑弹窗加弹性开关 */
window.editRecur=function(id){
  var it=id?(S.recur||[]).find(function(x){return x.id===id;}):null;
  var spendOpts=(function(){ return spendCats().map(function(k){return '<option value="'+k+'"'+((it?it.cat:k==='fixednc')===k?' selected':'')+'>'+esc(S.cats[k].n)+'</option>';}).join(''); })();
  openModal(it?'编辑周期项':'新增周期项',
    '<div class="field"><div class="fl">分类</div><select id="rc_cat" style="background:var(--bg2);border:1px solid var(--line2);color:var(--txt);border-radius:7px;padding:7px 9px;font-size:13px">'+spendOpts+'</select></div>'+
    '<div class="field"><div class="fl">金额</div><input class="inp" id="rc_amt" type="number" inputmode="decimal" value="'+(it?it.amt:'')+'" placeholder="0"></div>'+
    '<div class="field"><div class="fl">名称</div><input class="inp wide" id="rc_note" value="'+esc(it?it.note:'')+'" placeholder="房租 / 房贷 / AI订阅"></div>'+
    '<div class="field"><div class="fl">每月几号</div><input class="inp" id="rc_day" type="number" inputmode="numeric" min="1" max="28" value="'+(it?it.day:1)+'"></div>'+
    '<label style="display:flex;align-items:center;gap:8px;margin-top:11px;font-size:12.5px;color:var(--txt2);border:1px solid var(--line2);border-radius:9px;padding:9px 10px">'+
      '<input type="checkbox" id="rc_flex" '+(it&&it.flex?'checked':'')+' style="width:15px;height:15px;accent-color:var(--cy)">'+
      '<span>弹性金额 —— 每月到期时让我确认实际金额<br><span style="font-size:10.5px;color:var(--txt3)">适合金额会变的固定支出（如 AI 订阅、宠物粮）</span></span></label>'+
    '<div style="display:flex;gap:9px;margin-top:14px">'+(it?'<button class="btn mg full" onclick="delRecur(\''+it.id+'\')">删除</button>':'')+
    '<button class="btn ghost full" onclick="closeModal()">取消</button>'+
    '<button class="btn full" onclick="saveRecur('+(it?'\''+it.id+'\'':'null')+')">保存</button></div>');
};
window.saveRecur=function(id){
  var cat=$('rc_cat').value, amt=parseFloat($('rc_amt').value), note=$('rc_note').value.trim(), day=Math.max(1,Math.min(28,parseInt($('rc_day').value)||1));
  if(!(amt>0)){ toast('金额要大于 0','warn'); return; }
  var flexEl=$('rc_flex'), flex=flexEl?flexEl.checked:false;
  if(id){ var it=S.recur.find(function(x){return x.id===id;}); if(it) Object.assign(it,{cat:cat,amt:amt,note:note,day:day,flex:!!flex}); }
  else{
    S.recur=S.recur||[];
    S.recur.push({id:uid(),cat:cat,amt:amt,note:note||catName(cat),day:day,on:true,last:'',flex:!!flex});
  }
  save(); closeModal(); genRecur(); renderPage(); renderHUD(); toast('已保存');
};
window.toggleSkipRecur=function(id){
  var it=(S.recur||[]).find(function(x){return x.id===id;}); if(!it) return;
  var m=curM(); it.skipM=it.skipM||[];
  var i=it.skipM.indexOf(m);
  if(i>=0) it.skipM.splice(i,1); else it.skipM.push(m);
  it.last=m; save(); genRecur(true); renderPage(); renderHUD();
  toast(i>=0?'已恢复本月自动记':'已跳过本月');
};
/* 预算页周期列表: 弹性标记 + 跳本月按钮 (每行按名称匹配; 找不到则跳过) */
(function(){
  var _rb=(typeof renderBudget==='function')?renderBudget:function(){};
  window.renderBudget=function(){
    _rb();
    try{
      var el=$('page-budget'); if(!el) return;
      var box=el.querySelector('.ck-daily');
      if(!box){ var dc=window.dailyCardHTML?dailyCardHTML():''; if(dc) el.insertAdjacentHTML('afterbegin',dc); }
      var items=(S.recur||[]).slice().sort(function(a,b){return (+a.day||1)-(+b.day||1);});
      var rows=el.querySelectorAll('.rec-item'); var ri=0;
      rows.forEach(function(row){
        if(row.getAttribute('data-v3r')) return;
        var it=items[ri]; ri++;
        if(!it) return;
        row.setAttribute('data-v3r','1');
        var sw=row.querySelector('.sw'); if(!sw) return;
        var act=document.createElement('span');
        act.style.cssText='display:inline-flex;gap:5px;margin-left:7px;vertical-align:middle';
        var m=curM(), sk=it.skipM&&it.skipM.indexOf(m)>=0;
        if(it.flex) act.innerHTML+='<span class="tag" style="color:var(--cy);font-size:8.5px;border:1px solid rgba(0,229,255,.35)">弹性</span>';
        var b=document.createElement('button');
        b.className='mini'; b.textContent=sk?'恢复':'跳月';
        b.style.cssText='color:var(--txt3);font-size:9.5px;border:1px solid var(--line2);padding:1px 7px';
        b.onclick=function(){ toggleSkipRecur(it.id); };
        act.appendChild(b);
        sw.parentNode.insertBefore(act,sw);
      });
    }catch(e){}
  };
})();
})();
